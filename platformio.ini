[env:esp32s3]
platform = espressif32 @~8.0.0
board = esp32-s3-devkitc-1
framework = arduino
; 16MB Flash + OPI PSRAM；串口下载走默认 esptool
; 日志走 UART0（GPIO43/44）；想改用板载 USB 口看日志，追加 -DARDUINO_USB_CDC_ON_BOOT=1
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

; c3 是 4MB Flash：默认 default.csv 每个 app 分区 1.25 MB（1310720 字节），本固件已经装不下
; min_spiffs.csv 的两个 OTA 槽各 1.875 MB（1966080 字节），NVS/otadata 偏移不变，设置不会丢

[env:esp32c3]
platform = espressif32 @~8.0.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = min_spiffs.csv
; GPIO20/21 可分配；加载接线后任一脚被占用，自动关闭 UART0 应用/SDK 日志
; 两脚恢复空闲后启用 UART0 控制台，网页主板日志保留
; 仅控制应用运行期输出，不改变 ROM/Bootloader 启动输出
; 若要用板载 USB 口看日志，追加： -DARDUINO_USB_CDC_ON_BOOT=1

; 合宙 ESP32-C3 经典款与简约款共用固件（4MB Flash，板载 LED 在 GPIO12/13）
[env:esp32c3_air]
platform = espressif32 @~8.0.0
board = airm2m_core_esp32c3
framework = arduino
board_build.partitions = min_spiffs.csv
; 读取接线后按 GPIO18/19 占用启停原生 USB；GPIO20/21 占用时停用 UART0，网页日志保留
; 禁止启动前自动初始化 USB，避免驱动已分配给电机的 GPIO18/19
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBMCU_USB_CDC_AUTO=1
