[platformio]
default_envs = esp32c3_air

[env]
monitor_speed = 115200
lib_deps =
    robtillaart/PCF8575@^0.3.0

; BambuBus 校验统一使用 src/crc_bus.c，排除旧 CRC 库
lib_ignore =
    CRC

; ESP32 构建时压缩网页，并在生成固件和烧录前检查实际镜像大小
extra_scripts = pre:scripts/prepare_web.py


[env:pico]
platform = raspberrypi
board = pico
framework = arduino
; LDF 的 chain 模式不看 #if 条件，会把 ESP32 专用的 WiFi/Web 库误抓进来
lib_ignore =
    ${env.lib_ignore}
    WiFi
    DNSServer
    ESPmDNS
    WebServer
    Preferences
