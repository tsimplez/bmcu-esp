[platformio]
default_envs = pico

[env]
monitor_speed = 115200
lib_deps =
    robtillaart/PCF8575@^0.2.4
; Web 页面单独放在 web/index.html，构建时作为二进制块编进固件
; 导出符号：_binary_web_index_html_start / _binary_web_index_html_end
board_build.embed_txtfiles =
    web/index.html

[env:pico]
platform = raspberrypi
board = pico
framework = arduino
; LDF 的 chain 模式不看 #if 条件，会把 ESP32 专用的 WiFi/Web 库误抓进来
lib_ignore =
    WiFi
    DNSServer
    ESPmDNS
    WebServer
    Preferences
; build_type = debug  ; 编译时包含调试信息
; upload_protocol = cmsis-dap
;  upload_protocol = raspberrypi-swd
upload_protocol = picotool  
