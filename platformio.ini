[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; 16MB Flash + OPI PSRAM；串口下载走默认 esptool
; 日志走 UART0（GPIO43/44）；想改用板载 USB 口看日志，追加 -DARDUINO_USB_CDC_ON_BOOT=1
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
; 4MB Flash：默认 default.csv 只给 app 分区 1.25MB，本固件已经装不下，
; 换成 min_spiffs.csv（两个 OTA 槽各 1.875MB，NVS/otadata 偏移不变，设置不会丢）
board_build.partitions = min_spiffs.csv
; C3 默认 4 通道直连 GPIO；是否外挂 PCF8575 由 Web 开关决定，AMS 数量与通道接线也在 Web 配置
; 日志走 UART0（GPIO20/21），由 setup() 里的 hal_console_begin() 显式 begin；
; 若要用板载 USB 口看日志，追加：-DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:airm2m_core_esp32c3]
platform = espressif32
board = airm2m_core_esp32c3
framework = arduino
; 同上：4MB Flash 用 min_spiffs.csv，否则 app 分区只有 1.25MB 装不下
board_build.partitions = min_spiffs.csv
; 合宙 AirM2M CORE ESP32C3（4MB Flash，板载 LED 在 GPIO12/13）
; 引脚方案与 esp32c3 相同：见 platform.h；日志默认走 UART0（GPIO20/21），
; 要板载 USB 口看日志追加：-DARDUINO_USB_CDC_ON_BOOT=1
