name: Release Firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate release version
        shell: python
        run: |
          import datetime
          import os
          import re
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          header = Path("src/version.h").read_text(encoding="utf-8")
          match = re.search(r'^\s*#define\s+FW_VERSION\s+"([^"]+)"', header, re.MULTILINE)
          if not match or match[1] != version:
              raise SystemExit("标签版本必须与 src/version.h 的 FW_VERSION 一致")
          if not re.fullmatch(r"[0-9]{2}\.[0-9]{2}\.[0-9]{2}(?:\.[0-9]{1,3})?", version):
              raise SystemExit("版本格式必须为 YY.MM.DD 或 YY.MM.DD.修订号")
          datetime.date(2000 + int(version[:2]), int(version[3:5]), int(version[6:8]))

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - run: python -m pip install platformio

      - name: Build firmware
        run: pio run -e esp32s3 -e esp32c3_air

      - name: Generate OTA package
        shell: python
        run: |
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          notes = subprocess.check_output(["git", "log", "-1", "--pretty=%s"], encoding="utf-8").strip()

          dist = Path("dist")
          dist.mkdir(exist_ok=True)
          manifest = {}
          for target in ("esp32s3", "esp32c3_air"):
              data = Path(f".pio/build/{target}/firmware.bin").read_bytes()
              if version.encode("ascii") not in data:
                  raise SystemExit(f"{target} 固件不包含版本号 {version}，请重新编译")
              name = f"{target}-{version}.bin"
              (dist / name).write_bytes(data)
              manifest[target] = {
                  "version": version, "notes": notes, "url": name,
                  "size": len(data), "md5": hashlib.md5(data).hexdigest(),
              }
          factory = Path(f".pio/build/esp32c3_air/esp32c3_air-{version}.factory.bin")
          if not factory.exists():
              raise SystemExit(f"缺少首次烧录完整镜像：{factory}")
          (dist / factory.name).write_bytes(factory.read_bytes())
          (dist / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body: |
            ## 固件选择

            - ESP32-S3：选择 `esp32s3-*.bin`
            - 通用 ESP32-C3：选择 `esp32c3-*.bin`
            - 合宙 C3 经典款 / 简约款首次烧录：选择 `esp32c3_air-*.factory.bin`
            - 合宙 C3 经典款 / 简约款 OTA 更新：选择 `esp32c3_air-*.bin`

            ## 烧录步骤

            1. 在下方 Assets 中下载对应的固件；首次烧录选择 `.factory.bin` 完整镜像，后续 OTA 更新选择普通 `.bin`
            2. 使用 Type-C 数据线将 ESP32 连接到电脑
            3. 打开 [在线烧录网站](https://web.esphome.io)
            4. 点击连接 → 在左上角选择串行端口 → 点击安装（在“准备首次使用”旁边） → 选择下载好的固件并完成安装
            5. 最后连接 ESP32 的 Wi-Fi（`BMCU_xxxxxx`），访问 [192.168.4.1](http://192.168.4.1) 或 [http://bmcu.local](http://bmcu.local)
          generate_release_notes: true
          files: dist/*

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # 上传任务结束后再部署，避免立即查询刚上传的产物；Pages 失败可单独重跑
  deploy-pages:
    needs: release
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
