name: Build and Release Firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'src/**', 'lib/**', 'web/**') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Build firmware
        run: |
          pio run -e esp32s3 -e esp32c3 -e airm2m_core_esp32c3

      - name: Generate OTA package
        shell: bash
        run: |
          NOTES="$(git log -1 --pretty=%s)"
          python tools/make_ota.py \
            esp32s3 \
            esp32c3 \
            airm2m_core_esp32c3 \
            --version "${GITHUB_REF_NAME#v}" \
            --notes "$NOTES" \
            --out dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload OTA directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
