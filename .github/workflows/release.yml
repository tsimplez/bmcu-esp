name: Release Firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate release version
        shell: python
        run: |
          import datetime
          import os
          import re
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          header = Path("src/version.h").read_text(encoding="utf-8")
          match = re.search(r'^\s*#define\s+FW_VERSION\s+"([^"]+)"', header, re.MULTILINE)
          if not match or match[1] != version:
              raise SystemExit("标签版本必须与 src/version.h 的 FW_VERSION 一致")
          if not re.fullmatch(r"[0-9]{2}\.[0-9]{2}\.[0-9]{2}(?:\.[0-9]{1,3})?", version):
              raise SystemExit("版本格式必须为 YY.MM.DD 或 YY.MM.DD.修订号")
          datetime.date(2000 + int(version[:2]), int(version[3:5]), int(version[6:8]))

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - run: python -m pip install platformio

      - name: Build firmware
        run: pio run -e esp32s3 -e esp32c3 -e airm2m_core_esp32c3

      - name: Generate OTA package
        shell: python
        run: |
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          notes = subprocess.check_output(["git", "log", "-1", "--pretty=%s"], encoding="utf-8").strip()

          dist = Path("dist")
          dist.mkdir(exist_ok=True)
          manifest = {}
          for target in ("esp32s3", "esp32c3", "airm2m_core_esp32c3"):
              data = Path(f".pio/build/{target}/firmware.bin").read_bytes()
              if version.encode("ascii") not in data:
                  raise SystemExit(f"{target} 固件不包含版本号 {version}，请重新编译")
              name = f"firmware-{target}-{version}.bin"
              (dist / name).write_bytes(data)
              manifest[target] = {
                  "version": version, "notes": notes, "url": name,
                  "size": len(data), "md5": hashlib.md5(data).hexdigest(),
              }
          (dist / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
